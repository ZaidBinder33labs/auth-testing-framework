name: Auth QA

on:
  push:
    branches:
      - main
      - dev

  pull_request:
    branches:
      - main
      - dev

  schedule:
    - cron: '0 4 * * *'

  workflow_dispatch:

permissions:
  contents: read

jobs:
  auth-qa:
    name: Run Auth QA Tests
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      CI: true
      REDIS_URL: redis://localhost:6379

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Auth QA test suite
        id: qa_tests
        env:
          BINDER_CI_EMAIL: ${{ secrets.BINDER_CI_EMAIL }}
          BINDER_CI_PASSWORD: ${{ secrets.BINDER_CI_PASSWORD }}
          BINDER_CREATIVE_ADMIN_EMAIL: ${{ secrets.BINDER_CREATIVE_ADMIN_EMAIL }}
          BINDER_CREATIVE_ADMIN_PASSWORD: ${{ secrets.BINDER_CREATIVE_ADMIN_PASSWORD }}
          BINDER_TENANTS: ${{ secrets.BINDER_TENANTS }}
        run: npm run test:all

      - name: Generate QA report
        if: always()
        continue-on-error: true
        run: npm run qa:report:redis

      - name: Package QA report
        if: always()
        shell: bash
        run: |
          mkdir -p reports/auth/latest

          if [ ! -f reports/auth/latest/index.html ]; then
            cat > reports/auth/latest/report-unavailable.txt <<'EOF'
          QA report index.html was not generated.
          Check the GitHub Actions logs for the failure reason.
          EOF
          fi

          cd reports/auth
          zip -r "$GITHUB_WORKSPACE/auth-qa-report.zip" latest

      - name: Publish latest report
        if: success() && github.event_name != 'pull_request'
        uses: peaceiris/actions-gh-pages@v4
        with:
          personal_token: ${{ secrets.REPORTS_TOKEN }}
          external_repository: ZaidBinder33labs/auth-qa-reports
          publish_branch: gh-pages
          publish_dir: reports/auth/latest
          destination_dir: latest
          keep_files: true

      - name: Publish commit-specific report
        if: success() && github.event_name != 'pull_request'
        uses: peaceiris/actions-gh-pages@v4
        with:
          personal_token: ${{ secrets.REPORTS_TOKEN }}
          external_repository: ZaidBinder33labs/auth-qa-reports
          publish_branch: gh-pages
          publish_dir: reports/auth/latest
          destination_dir: runs/${{ github.sha }}
          keep_files: true

      - name: Upload QA report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-report-${{ github.sha }}
          path: auth-qa-report.zip
          if-no-files-found: warn
          retention-days: 90

  prod-scheduled:
    name: Run Prod Live Tests
    if: (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run prod suite with prod credentials
        env:
          CI: true
          REDIS_URL: redis://localhost:6379
          ENV: prod
          TARGET: binder
          TARGET_BASE_URL: https://app.binder-os.com
          BINDER_CI_EMAIL: ${{ secrets.BINDER_PROD_EMAIL }}
          BINDER_CI_PASSWORD: ${{ secrets.BINDER_PROD_PASSWORD }}
          BINDER_PROD_EMAIL: ${{ secrets.BINDER_PROD_EMAIL }}
          BINDER_PROD_PASSWORD: ${{ secrets.BINDER_PROD_PASSWORD }}
          BINDER_PROD_ACCOUNT_IDENTITY: ${{ secrets.BINDER_PROD_ACCOUNT_IDENTITY }}
          BINDER_TENANTS: ${{ secrets.BINDER_TENANTS }}
        run: npm run test:all
